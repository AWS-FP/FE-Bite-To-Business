name: Deploy frontend

on:
  push:
    branches: [feat/prod]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://api.bite2business.cloud
          VITE_VIETMAP_TILEMAP_KEY: ${{ secrets.VITE_VIETMAP_TILEMAP_KEY }}
        run: |
          if [ -z "$VITE_VIETMAP_TILEMAP_KEY" ]; then
            echo 'Missing GitHub secret VITE_VIETMAP_TILEMAP_KEY'
            exit 1
          fi
          npm run build

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::357646930356:role/btb-github-actions-fe
          aws-region: ap-southeast-1

      - name: Upload frontend to S3
        run: aws s3 sync dist/ s3://btb-frontend-357646930356/

      - name: Refresh CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E25S0WFMJSV8J --paths '/*'
